<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AAE3F"/>
      <stop offset="1" stop-color="#3D4A14"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#222A0A" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Three people, one in front: a workspace with members, and someone
       who owns it. Accounts draws a single figure; the group is the
       difference.

       Moss green, olive rather than Activity's lime or Consent's leaf green,
       because the clean greens are taken and a team is something that grows. -->
  <g filter="url(#sh)" fill="#FFFFFF">
    <!-- the two behind -->
    <circle cx="134" cy="194" r="52"/>
    <path d="M52 384 C52 318 90 276 134 276 C178 276 216 318 216 384 Q216 396 204 396 L64 396 Q52 396 52 384 Z"/>
    <circle cx="378" cy="194" r="52"/>
    <path d="M296 384 C296 318 334 276 378 276 C422 276 460 318 460 384 Q460 396 448 396 L308 396 Q296 396 296 384 Z"/>
  </g>

  <!-- the one in front, cut free of the other two by a ring in the
       background colour -->
  <g stroke="url(#bg)" stroke-width="24" fill="url(#bg)" stroke-linejoin="round">
    <circle cx="256" cy="172" r="70"/>
    <path d="M144 420 C144 336 196 284 256 284 C316 284 368 336 368 420 Q368 436 352 436 L160 436 Q144 436 144 420 Z"/>
  </g>
  <g filter="url(#sh)" fill="#FFFFFF">
    <circle cx="256" cy="172" r="70"/>
    <path d="M144 420 C144 336 196 284 256 284 C316 284 368 336 368 420 Q368 436 352 436 L160 436 Q144 436 144 420 Z"/>
  </g>
</svg>
